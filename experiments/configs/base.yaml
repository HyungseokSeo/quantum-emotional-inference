# Base configuration for experiments
experiment:
  name: "base"
  seed: 42

quantum:
  n_emotions: 7
  dtype: "complex64"
  tolerance: 1e-6

hierarchy:
  reactive_timescale: 0.1    # 100ms
  adaptive_timescale: 1.0    # 1s
  reflective_timescale: 10.0 # 10s
  gamma_reactive: 0.1
  gamma_adaptive: 1.0
  gamma_reflective: 5.0

free_energy:
  temperature: 1.0
  use_quantum_entropy: true

model:
  encoder_type: "resnet18"
  hidden_dim: 256
  use_cascade: true
  
training:
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_epochs: 100
  
data:
  dataset: "fer2013"
  img_size: 48
  augmentation: true
